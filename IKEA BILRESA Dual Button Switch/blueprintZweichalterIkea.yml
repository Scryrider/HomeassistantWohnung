blueprint:
  name: BILRESA Dual Button - Adaptives Licht (Phasen-Sensor)
  description: >
    Zwei-Tasten-Schalter für Matter event-Entitäten.
    Taste 1 kurz = Licht an (Farbe je Phase: Morgen/Tag in Kelvin, Abend/Nacht in RGB),
    Taste 2 kurz = Licht aus, Taste 1 lang = Szene aufrufen,
    Doppelklick auf Taste 1 / Taste 2 = frei belegbare Aktion.

    Die Phase (morgen, tag, abend, nacht) kommt aus einem zentralen
    Template-Sensor. Hier wird nur festgelegt, welche Farbe je Phase gilt.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    geraete:
      name: Geräte
      icon: mdi:light-switch
      input:
        taste1_entity:
          name: Taste 1 Entität
          description: event-Entität der ersten Taste
          selector:
            entity:
              domain: event
        taste2_entity:
          name: Taste 2 Entität
          description: event-Entität der zweiten Taste
          selector:
            entity:
              domain: event
        licht_entity:
          name: Lampe
          description: Die zu steuernde Lampe
          selector:
            entity:
              domain: light
        szene_entity:
          name: Szene
          description: Szene, die bei langem Druck auf Taste 1 aufgerufen wird
          selector:
            entity:
              domain: scene
        helligkeit:
          name: Helligkeit
          description: Helligkeit in Prozent beim Einschalten
          default: 90
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
              mode: slider

    farbtemperatur:
      name: Farbtemperatur je Phase
      icon: mdi:palette
      input:
        kelvin_morgen:
          name: Morgen
          description: Sonne unter der Schwelle, steigend
          default: 4000
          selector:
            color_temp:
              unit: kelvin
              min: 2000
              max: 6500
        kelvin_tag:
          name: Tag
          description: Sonne über der Schwelle
          default: 5000
          selector:
            color_temp:
              unit: kelvin
              min: 2000
              max: 6500
        rgb_abend:
          name: Abend (RGB)
          description: >
            Sonne unter der Schwelle, sinkend (auch Fallback, falls der
            Sonnensensor fehlt). Als RGB-Farbe, damit echtes Orange statt
            gelblichem Warmweiß möglich ist.
          default: [255, 180, 107]
          selector:
            color_rgb:
        rgb_nacht:
          name: Nacht (RGB)
          description: Zwischen Nachtbeginn und Nachtende, unabhängig von der Sonne
          default: [255, 147, 41]
          selector:
            color_rgb:

    doppelklick:
      name: Doppelklick (optional)
      icon: mdi:gesture-double-tap
      collapsed: true
      input:
        taste1_doppel:
          name: Taste 1 doppelt
          description: Aktion bei Doppelklick auf Taste 1. Leer lassen = keine Aktion.
          default: []
          selector:
            action: {}
        taste2_doppel:
          name: Taste 2 doppelt
          description: Aktion bei Doppelklick auf Taste 2. Leer lassen = keine Aktion.
          default: []
          selector:
            action: {}

    phase:
      name: Lichtphase
      icon: mdi:theme-light-dark
      input:
        phase_entity:
          name: Phasen-Sensor
          description: >
            Zentraler Template-Sensor, der morgen, tag, abend oder nacht liefert.
            Ist er nicht verfügbar oder liefert etwas anderes, gilt "abend".
          default: sensor.licht_phase
          selector:
            entity:
              domain: sensor

triggers:
  - trigger: state
    entity_id: !input taste1_entity
    id: taste1
    not_from: unavailable
    not_to: unavailable
  - trigger: state
    entity_id: !input taste2_entity
    id: taste2
    not_from: unavailable
    not_to: unavailable

actions:
  - variables:
      helligkeit: !input helligkeit
      kelvin_morgen: !input kelvin_morgen
      kelvin_tag: !input kelvin_tag
      rgb_abend: !input rgb_abend
      rgb_nacht: !input rgb_nacht
      phase_entity: !input phase_entity
      phase: >-
        {%- set p = states(phase_entity) -%}
        {{ p if p in ['morgen', 'tag', 'abend', 'nacht'] else 'abend' }}
      ereignis: "{{ trigger.to_state.attributes.event_type | default('') }}"
  - choose:
      - conditions:
          - condition: trigger
            id: taste1
          - condition: template
            value_template: "{{ ereignis == 'multi_press_2' }}"
        sequence: !input taste1_doppel
      - conditions:
          - condition: trigger
            id: taste2
          - condition: template
            value_template: "{{ ereignis == 'multi_press_2' }}"
        sequence: !input taste2_doppel
      - conditions:
          - condition: trigger
            id: taste1
          - condition: template
            value_template: "{{ ereignis == 'multi_press_1' }}"
        sequence:
          # Morgen/Tag: Farbtemperatur über die weißen LEDs (gute Farbwiedergabe).
          # Abend/Nacht: RGB über die Farb-LEDs (gesättigtes Orange möglich).
          - if:
              - condition: template
                value_template: "{{ phase in ['morgen', 'tag'] }}"
            then:
              - action: light.turn_on
                target:
                  entity_id: !input licht_entity
                data:
                  brightness_pct: "{{ helligkeit }}"
                  color_temp_kelvin: "{{ (kelvin_morgen if phase == 'morgen' else kelvin_tag) | int }}"
            else:
              - action: light.turn_on
                target:
                  entity_id: !input licht_entity
                data:
                  brightness_pct: "{{ helligkeit }}"
                  rgb_color: "{{ rgb_nacht if phase == 'nacht' else rgb_abend }}"
      - conditions:
          - condition: trigger
            id: taste2
          - condition: template
            value_template: "{{ ereignis == 'multi_press_1' }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input licht_entity
      - conditions:
          - condition: trigger
            id: taste1
          - condition: template
            value_template: "{{ ereignis == 'long_release' }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: !input szene_entity
mode: single
